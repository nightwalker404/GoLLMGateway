services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-gateway
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vllm-net

  vllm:
    image: vllm/vllm-openai:v0.6.3
    container_name: vllm-gateway
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - /dev/shm:/dev/shm
    ports:
      - "${VLLM_PORT}:8000"
    ipc: host
    env_file:
      - .env
    command: >
      --model Qwen/Qwen2.5-0.5B-Instruct
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION}
      --max-model-len ${VLLM_MAX_MODEL_LEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT}/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vllm-net

networks:
  vllm-net:
    driver: bridge

volumes:
  ollama-data: